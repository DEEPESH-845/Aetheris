name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aetheris
          POSTGRES_PASSWORD: aetheris
          POSTGRES_DB: aetheris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aetheris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aetheris:aetheris@localhost:5432/aetheris_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Schema has a migration for every change
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py ai_core.py
      - name: Smoke test auth and rate limiter
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZXhhbXBsZS5jb20k
        run: |
          python - <<'PY'
          import asyncio, main
          r = main.RateLimiter(2, 60)
          assert r.is_allowed("u") and r.is_allowed("u") and not r.is_allowed("u")
          r.forget("u"); assert r.requests == {}
          assert asyncio.run(main.verify_token("not-a-jwt")) is None
          print("ok")
          PY
